:root {
  --font-display: 'Cormorant', 'Georgia', serif;
  --font-body: 'Satoshi', 'Inter', sans-serif;
  --text-xs: clamp(0.75rem, 0.7rem + 0.25vw, 0.875rem);
  --text-sm: clamp(0.875rem, 0.8rem + 0.35vw, 1rem);
  --text-base: clamp(1rem, 0.95rem + 0.25vw, 1.125rem);
  --text-lg: clamp(1.125rem, 1rem + 0.75vw, 1.5rem);
  --text-xl: clamp(1.5rem, 1.2rem + 1.25vw, 2.25rem);
  --text-2xl: clamp(2rem, 1.2rem + 2.5vw, 3.5rem);
  --space-1: 0.25rem; --space-2: 0.5rem; --space-3: 0.75rem;
  --space-4: 1rem; --space-5: 1.25rem; --space-6: 1.5rem;
  --space-8: 2rem; --space-10: 2.5rem; --space-12: 3rem;
  --space-16: 4rem;
  --radius-sm: 0.375rem; --radius-md: 0.5rem;
  --radius-lg: 0.75rem; --radius-xl: 1rem; --radius-full: 9999px;
  --transition: 180ms cubic-bezier(0.16, 1, 0.3, 1);
  --content-wide: 1400px;
}

[data-theme="dark"] {
  --color-bg: #0e0d0b;
  --color-surface: #141310;
  --color-surface-2: #1a1916;
  --color-surface-offset: #201e1b;
  --color-border: #2e2c28;
  --color-divider: #252320;
  --color-text: #e8e4dc;
  --color-text-muted: #9a9690;
  --color-text-faint: #5a5850;
  --color-accent: #c8a84b;
  --color-accent-hover: #dfc068;
  --shadow-sm: 0 1px 3px oklch(0 0 0 / 0.3);
  --shadow-md: 0 4px 16px oklch(0 0 0 / 0.4);
  --shadow-lg: 0 12px 40px oklch(0 0 0 / 0.5);
}
[data-theme="light"] {
  --color-bg: #f5f1ea;
  --color-surface: #faf7f2;
  --color-surface-2: #fff;
  --color-surface-offset: #ede8df;
  --color-border: #d4cfc5;
  --color-divider: #e0dbd2;
  --color-text: #1a1814;
  --color-text-muted: #6b6760;
  --color-text-faint: #a8a49e;
  --color-accent: #8B5E1A;
  --color-accent-hover: #a06d20;
  --shadow-sm: 0 1px 3px oklch(0.2 0.01 80 / 0.08);
  --shadow-md: 0 4px 16px oklch(0.2 0.01 80 / 0.1);
  --shadow-lg: 0 12px 40px oklch(0.2 0.01 80 / 0.14);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; -webkit-font-smoothing: antialiased; }
body {
  font-family: var(--font-body);
  font-size: var(--text-base);
  color: var(--color-text);
  background: var(--color-bg);
  min-height: 100dvh;
  line-height: 1.6;
}
img, svg { display: block; }
button { cursor: pointer; background: none; border: none; font: inherit; color: inherit; }

/* HEADER */
header {
  position: sticky; top: 0; z-index: 100;
  background: var(--color-surface);
  border-bottom: 1px solid var(--color-border);
  backdrop-filter: blur(12px);
  padding: var(--space-4) var(--space-6);
  display: flex; align-items: center; justify-content: space-between;
  gap: var(--space-4);
}
.logo {
  display: flex; align-items: center; gap: var(--space-3);
}
.logo-svg { color: var(--color-accent); }
.logo-text {
  font-family: var(--font-display);
  font-size: var(--text-lg);
  font-weight: 600;
  letter-spacing: 0.02em;
  color: var(--color-text);
  line-height: 1;
}
.logo-sub {
  font-size: var(--text-xs);
  color: var(--color-text-muted);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  font-family: var(--font-body);
}
.theme-toggle {
  width: 40px; height: 40px;
  border-radius: var(--radius-md);
  display: flex; align-items: center; justify-content: center;
  color: var(--color-text-muted);
  transition: background var(--transition), color var(--transition);
}
.theme-toggle:hover { background: var(--color-surface-offset); color: var(--color-text); }

/* HERO */
.hero {
  padding: var(--space-12) var(--space-6) var(--space-10);
  text-align: center;
  background: linear-gradient(in oklab, var(--color-bg) 0%, var(--color-surface) 100%);
  border-bottom: 1px solid var(--color-divider);
  position: relative;
  overflow: hidden;
}
.hero::before {
  content: '';
  position: absolute; inset: 0;
  background: radial-gradient(ellipse 60% 50% at 50% 100%, oklch(from var(--color-accent) l c h / 0.08), transparent);
  pointer-events: none;
}
.hero-eyebrow {
  font-size: var(--text-xs);
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--color-accent);
  margin-bottom: var(--space-3);
  font-family: var(--font-body);
}
.hero h1 {
  font-family: var(--font-display);
  font-size: var(--text-2xl);
  font-weight: 600;
  line-height: 1.1;
  color: var(--color-text);
  margin-bottom: var(--space-3);
}
.hero-sub {
  color: var(--color-text-muted);
  font-size: var(--text-sm);
  max-width: 50ch;
  margin: 0 auto;
}

/* CONTROLS */
.controls {
  max-width: var(--content-wide);
  margin: 0 auto;
  padding: var(--space-6) var(--space-6) var(--space-4);
  display: flex; flex-direction: column; gap: var(--space-4);
}
.search-wrap {
  position: relative;
}
.search-icon {
  position: absolute; left: var(--space-4); top: 50%; transform: translateY(-50%);
  color: var(--color-text-faint); pointer-events: none;
}
#search {
  width: 100%;
  padding: var(--space-3) var(--space-4) var(--space-3) calc(var(--space-4) + 20px + var(--space-2));
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
  color: var(--color-text);
  font-family: var(--font-body);
  font-size: var(--text-sm);
  transition: border-color var(--transition), box-shadow var(--transition);
  outline: none;
}
#search:focus { border-color: var(--color-accent); box-shadow: 0 0 0 3px oklch(from var(--color-accent) l c h / 0.15); }
#search::placeholder { color: var(--color-text-faint); }

.filters {
  display: flex; gap: var(--space-2); flex-wrap: wrap; align-items: center;
}
.filter-btn {
  padding: var(--space-1) var(--space-3);
  border-radius: var(--radius-full);
  font-size: var(--text-xs);
  font-family: var(--font-body);
  font-weight: 500;
  letter-spacing: 0.04em;
  border: 1px solid var(--color-border);
  color: var(--color-text-muted);
  background: var(--color-surface);
  transition: all var(--transition);
  white-space: nowrap;
}
.filter-btn:hover { border-color: var(--color-accent); color: var(--color-text); }
.filter-btn.active {
  background: var(--color-accent);
  border-color: var(--color-accent);
  color: #0e0d0b;
  font-weight: 700;
}
.count-bar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 var(--space-6);
  max-width: var(--content-wide);
  margin: 0 auto var(--space-4);
}
.count-text {
  font-size: var(--text-xs);
  color: var(--color-text-muted);
  letter-spacing: 0.06em;
  text-transform: uppercase;
}
.count-num { color: var(--color-accent); font-weight: 700; }

/* GRID */
.grid-container {
  max-width: var(--content-wide);
  margin: 0 auto;
  padding: 0 var(--space-6) var(--space-16);
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(min(280px, 100%), 1fr));
  gap: var(--space-4);
}

/* CARD */
.card {
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-xl);
  overflow: hidden;
  transition: transform var(--transition), box-shadow var(--transition), border-color var(--transition);
  display: flex; flex-direction: column;
  box-shadow: var(--shadow-sm);
}
.card:hover {
  transform: translateY(-3px);
  box-shadow: var(--shadow-lg);
  border-color: oklch(from var(--color-accent) l c h / 0.4);
}
.card-stripe {
  height: 4px;
  width: 100%;
  flex-shrink: 0;
}
.card-body {
  padding: var(--space-5) var(--space-5) var(--space-4);
  display: flex; flex-direction: column; gap: var(--space-3);
  flex: 1;
}
.card-id {
  font-size: var(--text-xs);
  color: var(--color-text-faint);
  font-family: var(--font-body);
  letter-spacing: 0.08em;
  font-weight: 500;
}
.card-name {
  font-family: var(--font-display);
  font-size: clamp(1.05rem, 1rem + 0.3vw, 1.4rem);
  font-weight: 600;
  line-height: 1.2;
  color: var(--color-text);
  text-wrap: balance;
}
.card-divider {
  height: 1px;
  background: var(--color-divider);
  margin: 0;
}
.card-meta {
  display: flex; flex-direction: column; gap: var(--space-2);
}
.card-row {
  display: flex; align-items: flex-start; gap: var(--space-2);
}
.card-row-icon {
  width: 16px; height: 16px; flex-shrink: 0;
  margin-top: 2px;
  color: var(--color-text-faint);
}
.card-row-label {
  font-size: var(--text-xs);
  color: var(--color-text-faint);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  font-weight: 500;
  min-width: 52px;
  flex-shrink: 0;
}
.card-row-value {
  font-size: var(--text-sm);
  color: var(--color-text-muted);
  line-height: 1.4;
}
.type-badge {
  display: inline-flex;
  align-items: center;
  gap: var(--space-1);
  padding: 2px var(--space-2);
  border-radius: var(--radius-full);
  font-size: var(--text-xs);
  font-weight: 600;
  letter-spacing: 0.05em;
  border: 1px solid currentColor;
}

/* NO RESULTS */
.no-results {
  grid-column: 1 / -1;
  text-align: center;
  padding: var(--space-16) var(--space-8);
  color: var(--color-text-muted);
}
.no-results-icon { font-size: 3rem; margin-bottom: var(--space-4); }
.no-results h3 { font-family: var(--font-display); font-size: var(--text-xl); margin-bottom: var(--space-2); color: var(--color-text); }

/* RESPONSIVE */
@media (max-width: 640px) {
  header { padding: var(--space-3) var(--space-4); }
  .hero { padding: var(--space-8) var(--space-4) var(--space-6); }
  .controls { padding: var(--space-4); }
  .count-bar { padding: 0 var(--space-4); }
  .grid-container { padding: 0 var(--space-4) var(--space-12); gap: var(--space-3); }
}

/* FOOTER */
footer {
  border-top: 1px solid var(--color-divider);
  padding: var(--space-6);
  text-align: center;
  font-size: var(--text-xs);
  color: var(--color-text-faint);
  font-family: var(--font-body);
  letter-spacing: 0.06em;
}
</style>

const typeColors = {
  'Rosso': { stripe: '#7a1515', badge: '#c0392b', text: '#ffd5d5' },
  'Bianco': { stripe: '#8a6a00', badge: '#c8a84b', text: '#fff8dc' },
  'Champagne': { stripe: '#b8900a', badge: '#d4af37', text: '#fffacd' },
  'Spumante': { stripe: '#1a5f7a', badge: '#4a90a4', text: '#d0f0ff' },
  'Rosé': { stripe: '#8a2a4a', badge: '#d4688a', text: '#ffe0ec' },
  'Distillato': { stripe: '#4a2e1a', badge: '#8B6349', text: '#f5deb3' },
  'Dolce': { stripe: '#5a2a7a', badge: '#9B6B9B', text: '#e8d5f5' },
};

function getColor(type) {
  const t = Object.keys(typeColors).find(k => type.toLowerCase().includes(k.toLowerCase())) || 'Rosso';
  return typeColors[t] || typeColors['Rosso'];
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function renderCard(w) {
  const c = getColor(w.type);
  return `<div class="card" data-type="${escHtml(w.type)}">
    <div class="card-stripe" style="background:${c.stripe}"></div>
    <div class="card-body">
      <div class="card-id">V-${w.id}</div>
      <div class="card-name">${escHtml(w.name)}</div>
      <div class="card-divider"></div>
      <div class="card-meta">
        <div class="card-row">
          <svg class="card-row-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 2C8 2 5 6 5 10c0 5.5 7 12 7 12s7-6.5 7-12c0-4-3-8-7-8z"/></svg>
          <span class="card-row-label">Tipo</span>
          <span class="type-badge" style="color:${c.badge}">${escHtml(w.type)}</span>
        </div>
        <div class="card-row">
          <svg class="card-row-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 9h6M9 12h6M9 15h4"/></svg>
          <span class="card-row-label">Cantina</span>
          <span class="card-row-value">${escHtml(w.winery)}</span>
        </div>
        <div class="card-row">
          <svg class="card-row-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="8" cy="8" r="3"/><circle cx="16" cy="8" r="3"/><circle cx="12" cy="15" r="3"/></svg>
          <span class="card-row-label">Uvaggi</span>
          <span class="card-row-value">${escHtml(w.grapes)}</span>
        </div>
      </div>
    </div>
  </div>`;
}

const grid = document.getElementById('grid');
const countEl = document.getElementById('count');
const searchEl = document.getElementById('search');
let activeFilter = 'all';
let searchTerm = '';

function render() {
  const filtered = wines.filter(w => {
    const matchFilter = activeFilter === 'all' || w.type.toLowerCase().includes(activeFilter.toLowerCase());
    const q = searchTerm.toLowerCase();
    const matchSearch = !q || 
      w.name.toLowerCase().includes(q) || 
      w.winery.toLowerCase().includes(q) || 
      w.grapes.toLowerCase().includes(q) ||
      String(w.id).includes(q);
    return matchFilter && matchSearch;
  });

  countEl.textContent = filtered.length;

  if (filtered.length === 0) {
    grid.innerHTML = `<div class="no-results">
      <div class="no-results-icon">🍷</div>
      <h3>Nessun vino trovato</h3>
      <p>Prova con un altro termine di ricerca</p>
    </div>`;
    return;
  }

  grid.innerHTML = filtered.map(renderCard).join('');
}

document.getElementById('filters').addEventListener('click', e => {
  const btn = e.target.closest('.filter-btn');
  if (!btn) return;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  activeFilter = btn.dataset.filter;
  render();
});

searchEl.addEventListener('input', e => {
  searchTerm = e.target.value;
  render();
});

// Theme toggle
(function(){
  const t = document.querySelector('[data-theme-toggle]');
  const r = document.documentElement;
  let d = r.getAttribute('data-theme') || 'dark';
  const sunIcon = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>';
  const moonIcon = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';
  if(t) {
    t.innerHTML = d === 'dark' ? sunIcon : moonIcon;
    t.addEventListener('click', () => {
      d = d === 'dark' ? 'light' : 'dark';
      r.setAttribute('data-theme', d);
      t.innerHTML = d === 'dark' ? sunIcon : moonIcon;
    });
  }
})();

render();
</script>
